name: Inception

services:
  nginx:
    image: nginx
    build:
      dockerfile: requirements/nginx/Dockerfile
    ports:
      - "443:443"
      - "9000:9000"
    depends_on:
      - wordpress
      - mariadb
    env_file: ".env"
    environment:
      NGINX_PORT: 443
    restart: always
    volumes:
      - /home/login/data/WordPress
    networks:
      inception:

  wordpress:
    image: wordpress
    build:
      dockerfile: requirements/wordpress/Dockerfile
    depends_on:
      - mariadb
    env_file: ".env"
    environment:
      DOMAINNAME: "hey"
    restart: always
    volumes: 
      - /home/login/data/WordPress
    networks:
      inception:

  mariadb:
    image: mariadb
    build:
      dockerfile: requirements/mariadb/Dockerfile
    env_file: ".env"
    environment:
      DOMAINNAME: "hey"
    restart: always
    volumes:
      - /home/login/data/DB
    networks:
      inception:

networks:
  inception:
    driver: bridge
